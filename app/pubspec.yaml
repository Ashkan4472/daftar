name: daftar
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.13.5

dependencies:
  core:
    path: ../packages/core
  crypto: ^3.0.7
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  file_picker: ^13.2.0
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.3
  local_auth: ^3.0.2
  path: ^1.9.1
  path_provider: ^2.1.6
  persian_datetime_picker: ^3.2.0
  phosphor_flutter: ^2.1.0
  shamsi_date: ^1.1.1
  share_plus: ^13.3.1
  sqlite3: ^3.8.0
  timezone: ^0.11.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo.png
  generate: true
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/icon.png
  adaptive_icon_background: "#1E40AF"
  adaptive_icon_foreground: assets/brand/icon_foreground.png
  min_sdk_android: 23

flutter_native_splash:
  color: "#F8FAFC"
  image: assets/brand/splash_logo.png
  color_dark: "#0F172A"
  image_dark: assets/brand/splash_logo.png
  android_12:
    color: "#1E40AF"
    image: assets/brand/icon_foreground.png
  fullscreen: false
